name: 自动检查并更新应用版本

on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00（北京时间次日 02:00）自动运行
  workflow_dispatch:        # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update-apps:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查上游 Release 并更新 fnpack.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_apps.py

      - name: 提交并推送变更
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          if git diff --staged --quiet; then
            echo "版本无变化，无需提交。"
          else
            git commit -m "🤖 自动更新应用版本 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push || { git pull --rebase && git push; }
          fi
